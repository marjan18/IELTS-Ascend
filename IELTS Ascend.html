  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}

<script>

    { id: 'skills', label: 'Writing skills', types: [

      ['keyfeat', 'Identifying Key Features', 'Pick the features worth reporting.'], ['selcomp', 'Selecting and Comparing Data', 'Group figures and compare them.'],

      ['topics', 'Writing Topic Sentences', 'Open a paragraph with one clear idea.'], ['support', 'Developing Supporting Ideas', 'Explain and exemplify an idea.'],
      ['conclusion', 'Writing Conclusions', 'Close the essay without new ideas.'], ['cohesion', 'Coherence and Cohesion', 'Link ideas clearly and logically.'],

      ['paraphrase', 'Paraphrasing the Question', 'Rewrite the task without copying.'] ] }

IC.add = function (skill, type, setId, g, items) {
  items.forEach(function (it, i) {
    var o = it.o || g.opts, ov = it.ov || g.vals;
    var options = o ? o.map(function (l, j) { return { v: ov ? ov[j] : LET[j], l: l }; }) : null;
    IC.BANK.push({
      id: skill + '.' + type + '.' + setId + '.' + (i + 1), skill: skill, section: g.section || null, question_type: type,
      subskill: it.sub || g.sub || null, topic: g.topic || null, difficulty: IC.DIFF[it.d] || 'medium',
      source: 'original', source_url: null, content_permission_status: 'original',
      explanation: it.x, answer_key: it.k, learning_objective: g.obj || null, distractor_explanations: it.dx || null,
      related_question_ids: [], set: setId, prompt: it.p, format: options ? 'choice' : 'text', options: options,
      hint: it.h || null, evidence: it.ev || null, where: it.w || null, error_category: it.ec || null, phrase: it.ph || null
    });
  });
};
IC.TFNG = { opts: ['TRUE', 'FALSE', 'NOT GIVEN'], vals: ['TRUE', 'FALSE', 'NOT GIVEN'] };
IC.YNNG = { opts: ['YES', 'NO', 'NOT GIVEN'], vals: ['YES', 'NO', 'NOT GIVEN'] };

/* ---------- strategies ---------- */
function S(what, steps, trap) { return { what: what, steps: steps, trap: trap }; }
IC.STRAT.listening = {
  form: S('You hear a conversation and complete a form. Answers are usually names, numbers, dates and prices.', ['Read the form first and predict the kind of answer for each gap (name, number, day).', 'Watch the word limit and the spelling of names; names are often spelled out.', 'Expect corrections ("sorry, I mean Thursday"); the final version is the answer.', 'Check your answer is the right type: a time, not a date.'], 'The first number you hear is often corrected a moment later.'),
  note: S('You complete notes from a talk. The notes follow the order of the talk.', ['Underline key words in each note, then predict the missing word type.', 'Follow the order: the answers come in the same sequence as the notes.', 'Write words exactly as heard, within the word limit.'], 'Synonyms: the notes paraphrase the speaker, so listen for meaning rather than the exact words on the page.'),
  table: S('You fill gaps in a table. The speaker moves across rows or columns.', ['Scan the headings to learn what each row and column is about.', 'Decide whether the speaker will go row by row or column by column.', 'Listen for the item name, then the detail you need.'], 'The speaker may mention two similar details; check which belongs to your row.'),
  summary: S('You complete a short summary of the recording.', ['Read the summary and predict the grammar of each gap.', 'Listen for the idea, not just the words, because the summary paraphrases.', 'Check that your answer fits the sentence grammatically.'], 'The summary often follows the order of the recording but compresses it.'),
  sentence: S('You finish sentences with words from the recording.', ['Underline the keywords in each sentence.', 'Predict the missing word type.', 'Listen for paraphrases of the keywords.'], 'The answer is usually just after the paraphrase of your keywords.'),
  mcq: S('You choose the answer that matches what the speaker says overall.', ['Underline the keywords in the question, not the options.', 'Expect every option to be mentioned; only one answers the question.', 'Listen to the whole section before choosing, because speakers change their mind.'], 'Distractors use the same words as the recording but in a different meaning.'),
  matching: S('You match items to a list of options. Options are mentioned in a different order from the items.', ['Read the options and underline their key words.', 'Listen for each item and note which option it is linked to.', 'Cross out used options if each can only be used once.'], 'A speaker may mention an option and then reject it.'),
  map: S('You label places on a plan or map by following directions.', ['Find where you start (entrance, gate) and which way you are facing.', 'Note landmarks and compass points on the plan.', 'Listen for position phrases: opposite, next to, beyond, at the end of, on your left.', 'Mark each place as you hear it and eliminate that letter.'], 'Left and right change if the speaker changes direction, so keep track of where you are standing.'),
  short: S('You answer questions with a few words. The word limit matters.', ['Read the questions and underline the question word.', 'Answers follow the order of the recording.', 'Use words you hear. Do not change the form.'], 'Writing too many words loses the mark even if the idea is right.')
};
IC.STRAT.reading = {
  tfng: S('Decide whether a statement agrees with the passage (TRUE), contradicts it (FALSE), or the passage gives no information to decide (NOT GIVEN).', ['Underline the keywords in the statement.', 'Find the matching part of the passage, usually in the same order as the questions.', 'TRUE: the passage says the same thing in different words. FALSE: it says the opposite. NOT GIVEN: the topic appears but the specific claim does not.', 'Never use your own knowledge to decide.'], 'NOT GIVEN is not the same as FALSE. If the passage never says it, it is NOT GIVEN.'),

  mcq: S('Choose the answer supported by the passage.', ['Read the question stem and find the section.', 'Eliminate options that are wrong or not mentioned.', 'Check the remaining option against the text.'], 'A tempting option may be true in real life but not stated in the passage.'),
  sentence: S('Complete sentences using words from the passage.', ['Underline keywords and predict the missing word type.', 'Find the section and look near the paraphrase.', 'Copy the exact words within the word limit.'], 'Check grammar: your answer must fit the sentence.'),
  summary: S('Complete a summary of a section of the passage.', ['Read the summary first to understand the topic.', 'Find the part of the passage it summarises.', 'Choose exact words from the passage.'], 'The summary paraphrases, so the missing word is often a key term from the passage.'),
  note: S('Complete notes using words from the passage.', ['Use the headings in the notes to find the right section.', 'Predict the missing word type.', 'Check the word limit.'], 'Notes are short; the answer is usually a noun or number.'),
  table: S('Complete a table using information from the passage.', ['Use row and column headings as keywords.', 'Scan for each heading in the passage.', 'Copy the exact words.'], 'Several rows may use similar words; check which row you are in.'),
  flowchart: S('Complete the stages of a process.', ['Find the stage of the process described in the passage.', 'Follow the sequence words: first, then, next, finally.', 'Copy the exact words within the limit.'], 'Stages may be described out of order.'),
  diagram: S('Label parts of a diagram using the passage.', ['Study the diagram and its parts.', 'Find the section that describes them.', 'Match the position words (above, below, top layer) to the diagram.'], 'Position words in the passage tell you which label goes where.'),
  short: S('Answer questions using words from the passage.', ['Underline the question word and keywords.', 'Find the matching section.', 'Write words from the passage within the limit.'], 'Do not answer from your own knowledge.')

IC.STRAT.writing = {

  keyfeat: S('Key features are the highest, lowest and most important changes.', ['Look for peaks, lows and biggest differences.', 'Group related data.', 'Report with figures.'], 'Describing every number wastes words.'),

};
['line', 'bar', 'pie', 'table', 'map', 'process', 'mixed'].forEach(function (k) { IC.STRAT.writing[k] = S('Write a Task 1 report of at least 150 words describing the visual: introduction, overview, then detailed paragraphs with key figures.', ['Paraphrase the task in one sentence.', 'Write an overview with the main trend or contrast.', 'Report key features with data in two body paragraphs.', 'Check units, tenses and time periods.'], 'Do not give reasons or opinions; describe only what the visual shows.'); });

IC.STRAT.speaking = {

  p2('People', 'Describe a person who has influenced you.', ['who the person is', 'how you know them', 'what they have done', 'and explain why they influenced you'], null, 'I would like to talk about my aunt, who has influenced me more than anyone. She is a doctor, and she showed me that hard work and kindness can go together. For example, she volunteered at a free clinic every weekend even when she was exhausted. Because of her, I decided to study science.');
